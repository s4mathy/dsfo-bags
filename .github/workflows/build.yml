name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Compilar
        run: |
          set +e
          gradle build --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|warning: \[|What went wrong|Could not|Caused by|FAILURE|symbol:|location:|^> " build.log | head -60 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Fallo de build::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: dsfo-bags-jar
          path: build/libs/*.jar
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" --title "dsfo-bags (1.21.1)" --notes "Build automatico" --target "$GITHUB_SHA"
